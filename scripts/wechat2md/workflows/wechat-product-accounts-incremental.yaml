  analysis_outputs:
    - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_publisher_analysis.json
    - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_publisher_analysis.md
    - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_analysis_quality_report.json
    - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_structured_import_receipt.json
  analysis_commands:
    - python3 scripts/wechat2md/analysis/publisher-analysis.py --source-dir /Users/adobe/Project/output/WechatArticles --file-list <manifest> --output-dir /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id> --dry-run
    - python3 scripts/wechat2md/analysis/publisher-analysis.py --source-dir /Users/adobe/Project/output/WechatArticles --file-list <manifest> --output-dir /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>
  import_commands:
    - python3 scripts/wechat2md/kb-import/batch-products-structured-import.py --data-json /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_publisher_analysis.json --receipt-json /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_structured_import_receipt.json --dry-run
    - python3 scripts/wechat2md/kb-import/batch-products-structured-import.py --data-json /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_publisher_analysis.json --receipt-json /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis/publisher-analysis/product-accounts-<run_id>/_structured_import_receipt.json --confirm
  post_import_checks:
    - python3 scripts/wechat2md/kb-import/cleanup-wechat-products-structured-noise.py --dry-run
  import_policy:
    default: Run dry-run first. It writes a SHA256-bound, expiring receipt; only run --confirm with the same current-run data-json, candidate summary, quality state, subject filter, and unexpired receipt.
    target_runtime: knowledge-vault structured/products is the formal products KB runtime. Do not treat wiki syntheses as the final products KB landing surface.
    no_arg_import_guard: Do not run batch-products-structured-import.py without --data-json and either --dry-run or --confirm.
    noise_guard: batch-products-structured-import filters obvious non-product extraction fragments; post-import noise dry-run should report noisy_docs=0 for active structured product docs.
    quality_hard_gate: Refuse --confirm unless analysis JSON quality.status is pass and the receipt matches. Sentence-like product-name noise is a hard failure; unknown publishers and publisher conflicts are review warnings, not batch-wide blockers. Article-level publisher labels remain candidates and never become stable attribution edges without verified single-product evidence.
    conflict_policy: Merge all same-slug sources. Preserve publisher conflicts as needs-review records with no stable attribution edge; preserve unknown publishers as weak product evidence without an attribution edge.
    override_policy: Scheduled automation must never use --high-risk-override-quality-gate. A human-only override requires that explicit flag, a written reason, and an audit report.
  legacy_product_osint_import:
    status: not_default_for_this_workflow
    scripts:
      - scripts/wechat2md/analysis/extract-products.py
      - scripts/wechat2md/kb-import/write-known-products.py
      - scripts/wechat2md/kb-import/write-multi-pub-light.py
      - scripts/wechat2md/kb-import/write-single-pub.py
    reason: These scripts consume static all-run artifacts and some legacy source wording; they must be explicitly reviewed and adapted before use with current-run manifests.
  preflight:
    - Use py_compile or file existence checks for scripts; do not use --help as a harmless validation.
    - Confirm publisher-analysis dry-run reports total_articles equal to the manifest file count and inspect quality status before writing analysis outputs.
    - Require _analysis_quality_report.json status=pass before the normal confirm path.
    - Confirm batch-products-structured-import dry-run writes a matching, unexpired receipt for the current-run data-json before running --confirm.
    - After confirm, verify at least one newly imported product can be found with search-structured-kb.py --kb products.
    - After confirm, run cleanup-wechat-products-structured-noise.py --dry-run and require noisy_docs=0.
  allowed_writes:
    - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-analysis
    - /Users/adobe/Project/knowledge-vault/documents/product:wechat-product-*.json
    - /Users/adobe/Project/knowledge-vault/structured/products/records.jsonl
    - /Users/adobe/Project/knowledge-vault/structured/products/index.sqlite
    - /Users/adobe/Project/knowledge-vault/structured/products/manifest.json
    - /Users/adobe/Project/knowledge-vault/structured/products/views
  forbidden_commands:
    - /Users/adobe/Project/knowledge-vault/scripts/import-steam-indienova.py
    - /Users/adobe/Project/knowledge-vault/scripts/build-steam-catalog-index.py
    - /Users/adobe/Project/knowledge-vault/scripts/rebuild-kb-store.py

