version: 14
id: wechat-product-accounts-incremental
updated_at: "2026-08-05"
owner_project: wechat-article-exporter
purpose: >
  Incrementally sync selected WeChat public accounts, download newly missing
  articles from 2025 onward as lite Markdown with CDN image links, then run the
  existing WeChat article product distillation and product-oriented KB import
  workflow.

generic_account_recovery:
  canonical_entry: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/workflows/wechat-account-visible-recovery.yaml
  relationship: Each account below is one concrete input to the generic stable-biz resource and visible-recovery contract; this product workflow adds only its three-account batch scope, product analysis, receipt, import, and atomic state gates.
  generic_scope_rule: Do not infer that the tool supports only the accounts in this file. Any other account uses the generic workflow directly and never enters this workflow's product-analysis manifest unless explicitly added here.

run_identity:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/run_artifact.py
  owner_token_rule: Generate and retain one full UUID per run; never truncate it.
  artifact_root: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs
  reserve_command: python3 scripts/wechat2md/run_artifact.py --root <artifact_root> --workflow-id wechat-product-accounts-incremental --owner-token <owner_token>
  rule: Use the helper's atomically reserved YYYYMMDDTHHMMSSZ-<full-owner-UUID> run_id and run_dir for every current-run artifact.
  collision_policy: The helper retries an atomic directory reservation on collision; never construct or reuse a date-only artifact path.

account_leases:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  path_template: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/accounts/<account.state_key>.json
  ttl_seconds: 3600
  owner_token_policy: Retain the run owner token in process memory and use it for every account lease acquired by this run.
  acquire_command: python3 scripts/wechat2md/automation_lease.py acquire --lease-file <account.lease_file> --workflow-id wechat-product-accounts-incremental:<account.state_key> --owner-token <owner_token> --ttl-seconds 3600
  busy_policy: Record the busy account as skipped and continue with other accounts; never release a lease owned by another token.
  held_scope: Hold each acquired account lease across that account's scan/download plus the shared manifest, analysis, formal product import, verification, and that account's state update.
  heartbeat_command: python3 scripts/wechat2md/automation_lease.py heartbeat --lease-file <account.lease_file> --owner-token <owner_token> --ttl-seconds 3600 --interval-seconds 300 --max-lifetime-seconds 43200 --quiet
  heartbeat_policy: Start and monitor one heartbeat per acquired account lease. If any heartbeat exits, reaches its 12-hour maximum lifetime, or owner-checked renewal fails, stop before further download, --confirm, or state writes for that account.
  finally_release: In a finally block, release every acquired account lease with the same owner token on success, failure, cancellation, or partial execution.
  release_command: python3 scripts/wechat2md/automation_lease.py release --lease-file <account.lease_file> --owner-token <owner_token>

service_startup_lease:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  lease_file: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/services/wechat2md-localhost-3000.json
  ttl_seconds: 180
  scope: Protect only the healthcheck/recheck/startup transition for the shared localhost service; never hold this lease during scan, download, analysis, or import.
  procedure: Run the local-API readiness check first. If ready, reuse the service without acquiring this lease. If not ready, acquire, check again, and inspect the root listener before starting. Start only when localhost:3000 has no incompatible listener, then release immediately after readiness succeeds.
  busy_policy: When another run owns the startup lease, poll the localhost healthcheck within the startup TTL; do not stop account processing merely because service startup is already in progress.
  incompatible_listener_policy: If the root origin responds but the local-API readiness check fails, record service_incompatible and stop before authenticated scans or downloads; never kill, replace, or reuse that listener.
  shutdown_policy: Treat localhost:3000 as a shared singleton and do not stop it automatically at workflow completion.

authenticated_api_lease:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  request_helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/mp_api_request.py
  lease_file: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/api/wechat-mp-session.json
  ttl_seconds: 300
  request_timeout_seconds: 30
  local_proxy_timeout_seconds: 25
  post_response_cooldown_seconds: 2
  backoff_seconds:
    - 30
    - 60
    - 120
  scope: Serialize only authenticated /api/web/mp/searchbiz, /api/web/mp/appmsgpublish, and local profile_ext fallback requests that reach WeChat; downloads, analysis, and imports never hold this lease.
  command_template: python3 scripts/wechat2md/mp_api_request.py --lease-file <lease_file> --owner-token <owner_token> --workflow-id wechat-product-accounts-incremental:wechat-mp-api --lease-ttl-seconds 300 --wait-timeout-seconds 300 --request-timeout-seconds 30 --cooldown-seconds 2 --backoff-seconds 30,60,120 -- <curl request>
  request_policy: Every authenticated request must run through request_helper, which holds the API lease through the response and the full 2-second post-response cooldown before owner-checked release.
  timeout_policy: The localhost MP proxy starts its 25-second budget at proxy entry, aborts the upstream WeChat fetch before request_helper's 30-second client timeout, and refuses to start upstream work when the client already disconnected during token or cookie lookup.
  busy_policy: Wait and retry this request when another workflow owns the API lease; never skip an account merely because the shared session is in use.
  frequency_control_policy: request_helper renews before every request, cooldown, and 30/60/120-second backoff; owner loss stops the request, and the 300-second TTL exceeds one 30-second request plus the longest pause and safety margin.

concurrency:
  model: different_accounts_parallel_same_account_serial
  safe_parallel_with:
    - indienova-steam-incremental
  scan_request_policy: Use authenticated_api_lease so only the shared-session requests are serialized and rate-limited; per-account reconciliation, downloads, and imports remain independent.
  import_policy: Product confirm writes remain serialized only inside batch-products-structured-import.py by its structured-ai-products writer lock; scans, downloads, dry-runs, and Steam imports do not use that lock.

sync_state:
  scope: one_file_per_account
  path_template: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/accounts/<account.state_key>.json
  legacy_read_fallback: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/wechat-product-accounts-incremental.json
  migration: When an account state is absent, first read account.legacy_state_path, then only that account's entry from legacy_read_fallback. Leave both legacy sources untouched and publish the stable-biz state_path only after the account's fully verified batch succeeds.
  persistence: Write a temporary JSON file and atomically replace the state file only after the whole leased workflow and its verification succeed.
  per_account_schema:
    high_watermark_publish_timestamp: newest successfully reconciled publish timestamp
    high_watermark_article_ids: article ids observed at that timestamp
    last_successful_run_at: ISO-8601 timestamp
    last_integrity_audit_at: ISO-8601 timestamp
    last_integrity_audit_date_floor: "2025-01-01"
  failure_policy: Keep the previous per-account state unchanged when any download, analysis, receipt, import, or verification step fails.

service:
  cwd: /Users/adobe/Project/tools/wechat-article-exporter
  origin: http://localhost:3000/
  start_command: WECHAT2MD_LOCAL_OUTPUT_ENABLED=true WECHAT2MD_OUTPUT_DIR=/Users/adobe/Project/output/WechatArticles yarn dev --host localhost --port 3000
  root_healthcheck_command: curl --fail --silent --show-error --head http://localhost:3000/
  healthcheck_command: curl --fail --silent --show-error http://localhost:3000/api/local/wechat2md/credentials | jq -e '.success == true and .outputDir == "/Users/adobe/Project/output/WechatArticles"'
  readiness_contract: Require HTTP 200, JSON success=true, and outputDir exactly equal to required_output_root. A healthy root page or a local API bound to another output root is incompatible.
  output_root_env: WECHAT2MD_OUTPUT_DIR
  required_output_root: /Users/adobe/Project/output/WechatArticles
  origin_rule: Do not use http://127.0.0.1:3000/ because browser IndexedDB is origin-scoped.
  lifecycle: Shared singleton coordinated by service_startup_lease; reuse an already healthy service.

auth:
  mode: existing_session_with_ephemeral_profile_fallback
  auth_key_source: local cookie store used by wechat-article-exporter
  request_header: X-Auth-Key
  chrome_policy: Reuse the user's already-open normal Google Chrome only for relogin or the official WeRead visible-page fallback. Never launch a dedicated or alternate browser profile.
  credential_policy: Do not invent, persist, log, or replace credentials. The optional profile_ext fallback may use only fresh Credentials already synchronized by the localhost dashboard into process memory. The WeRead fallback uses host Chrome control against the already-rendered official reader page without reading or exporting cookies, tickets, browser storage, or profile files. Partial sources never complete an audit or advance sync state.
  profile_credential_cache:
    sync_endpoint: POST /api/local/wechat2md/credentials
    status_endpoint: GET /api/local/wechat2md/credentials
    storage: process_memory_only
    maximum_age_minutes: 25
    secret_exposure: Status responses contain only biz, optional nickname, capturedAt, and expiresAt; key, pass_ticket, cookie, uin, and appmsg_token are never returned.
    origin_policy: Credential synchronization is enabled only for the localhost origin while WECHAT2MD_LOCAL_OUTPUT_ENABLED=true and a non-empty WECHAT2MD_OUTPUT_DIR is configured.

