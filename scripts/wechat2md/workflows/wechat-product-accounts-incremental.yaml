article_scan:
  source_priority:
    preferred_acquisition: Reuse the user's normal Chrome and the rendered WeRead catalog first for every account in this workflow; reconcile any already-downloaded canonical local records before making a network list request.
    routine_order:
      - local_canonical_export_reconciliation
      - weread_chrome_fallback
      - public_index_fallback
    complete_source_probe: appmsgpublish and profile_ext are completeness probes only. Do not call them before the preferred acquisition path when the session is already known to return frequency control; a successful complete probe may still advance state under the existing gates.
    dashboard_rule: The public-account manager follows generic_account_recovery.canonical_entry for every account. It reconciles canonical local records and then continues bounded public discovery even when old local records exist; authenticated complete sources are a final probe only when preferred sources are unavailable.
  complete_probe_endpoint: /api/web/mp/appmsgpublish
  profile_ext_fallback:
    endpoint: /api/local/wechat2md/article-list
    trigger: Use only as an explicit complete-source probe after local/WeRead acquisition, or when the preferred visible-page source is unavailable and current source-health evidence does not already mark the authenticated list path frequency controlled.
    credential_preflight: Query GET /api/local/wechat2md/credentials and require a fresh entry whose biz exactly matches the selected account fakeid; never send Credential secrets from the automation request.
    request_policy: Run every fallback page request through authenticated_api_lease because the local endpoint still reaches WeChat. Pass only id, begin, and size to localhost.
    response_contract: Require source=profile_ext, base_resp.ret=0, articles as a normalized flat list, can_continue, and next_offset. The adapter expands primary and multi_app_msg_item_list entries, rejects deleted entries and non-mp.weixin.qq.com links, and derives stable aid values from mid plus idx.
    pagination: Start at begin=0, then use next_offset while can_continue=true. Apply the same high-watermark, dynamic overlap, integrity audit, date floor, and local index.md reconciliation rules as the appmsgpublish complete probe.
    maximum_pages_per_account: 500
    progress_guard: Track every requested offset and a SHA256 signature of each page's ordered canonical aid/link list. Require next_offset to be greater than the current offset and previously unseen; stop the account on a repeated offset, repeated page signature, or page-limit breach.
    progress_failure_policy: Treat any progress-guard breach as a scan failure, preserve the previous per-account sync state, and do not continue requesting pages.
    unavailable_policy: If the matching Credential is absent or expired, or fallback returns a nonzero ret including frequency control, continue to weread_chrome_fallback. Preserve the previous per-account sync state regardless of partial-source results.
    source_consistency: A complete-source probe may switch from appmsgpublish to profile_ext, but high-watermark identity remains publish timestamp plus canonical aid; never merge duplicate links twice.
  weread_chrome_fallback:
    trigger: Use as the default discovery and acquisition source for the workflow accounts whenever the user's normal Chrome is available and signed in; do not wait for appmsgpublish or profile_ext to fail first.
    reader_url_helper: node scripts/wechat2md/weread_reader_url.mjs --stable-biz <account.stable_biz>
    browser_policy: Reuse the user's already-open, signed-in normal Google Chrome through host Chrome control. Do not launch a dedicated profile or another browser, do not take over the PC WeChat client, and do not use a system proxy, trusted certificate, browser-cache extraction, exported cookies, copied x-wr-ticket, raw CDP, or private JSON endpoint navigation.
    login_policy: If normal Chrome is unavailable, not connected to host control, or not signed in at https://weread.qq.com, stop that account with existing_chrome_unavailable or login_required. Never open an alternate browser and never bypass a CAPTCHA; stop and report captcha_required.
    identity_policy: Derive bookId and the official reader URL only with reader_url_helper. Require the rendered reader heading to equal account.name and accept only article URLs whose host is mp.weixin.qq.com and whose __biz exactly equals account.stable_biz.
    directory_scan: Open the helper-produced official reader URL in a background tab of the existing Chrome, click the visible directory control, and record the initial rendered item count and oldest date. Physically scroll the visible directory with host Chrome control in bounded steps, recording item count after every lazy-load batch, until an entry older than the active overlap or audit boundary is rendered; do not call /web/mp/articles or another hidden list API.
    lazy_load_guard: The first rendered batch is not complete coverage. Unless that first batch already contains an entry older than the boundary, require at least one physical scroll, require directoryEntriesLoaded to grow beyond initialDirectoryEntries, and continue until a strictly older-than-boundary entry is captured. A stalled count before the boundary is a scan failure, never a successful boundary result.
    catalog_snapshot: Write a run-owned per-account JSON snapshot with boundary, initialDirectoryEntries, initialOldestDate, scrollSteps, directoryEntriesLoaded, oldestLoadedDate, boundaryReached, parseErrors, and every ordered date/title entry. Require directoryEntriesLoaded to equal entries.length.
    reconciliation_command: node scripts/wechat2md/weread_catalog_audit.mjs --catalog <run_dir>/<account>-weread-catalog.json --account-dir <account.output_dir> --output <run_dir>/<account>-weread-catalog-audit.json
    reconciliation_policy: Run the catalog audit before recovery, download only its missing entries after official og:url extraction, then rerun it. Save every opened article's exact title, rendered date, og:url, biz, mid, and idx in a run-owned official-article evidence JSON. Require missing=0, ambiguous=0, localReadErrors=0, and dateMismatches=0 before reporting local reconciliation success.
    metadata_repair_policy: After missing and ambiguity are zero, run weread_catalog_audit.mjs once with --apply-date-repairs true and once with --apply-url-repairs true --official-articles <run-owned-evidence> --expected-biz <account.stable_biz>, always as separate invocations with an explicit run-owned --backup-dir. Date repair may change only the uniquely matched frontmatter date. URL repair may replace only a trusted mp.weixin.qq.com article URL that lacks stable identity; it must reject malformed official evidence, cross-account biz, ambiguous title/date matches, and any conflicting stable biz/mid/idx. Retain every backup and rerun the audit without repair to prove dateMismatches=0, canonicalUrlsVerified equals the official evidence count, urlRepairsNeeded=0, urlIdentityMismatches=0, and officialUrlEvidenceErrors=0.
    dashboard_reconciliation: After local catalog and canonical URL reconciliation succeeds, reuse normal Chrome at http://localhost:3000/dashboard/account, select only the exact account, and run 对齐本地导出. The client may restore only exact account-name records whose URL carries matching stable biz plus explicit positive numeric mid and idx; short links, missing idx, and cross-account identities are skipped. Run the action a second time and require zero new articles/messages, then verify every official-evidence article by title and publication date in the account article view.
    dashboard_state_policy: Dashboard reconciliation updates only the localhost IndexedDB article/info cache and never changes the workflow sync-state file, source coverage, integrity-audit completion, or high-watermark.
    date_normalization: Resolve Today, Yesterday, and M/D labels in Asia/Shanghai using the run date, decrementing the year only when the ordered directory crosses a year boundary. The final date must still equal the full date rendered inside the opened article.
    article_extraction: Click each date-eligible directory entry, wait for the rendered title and publication date, then read only the rendered main article iframe srcdoc. Extract meta og:title and meta og:url, require the title/date to match the selected directory entry, normalize HTML entities, and reject missing, malformed, cross-account, title-only, or empty-body records.
    maximum_directory_entries_per_account: 500
    interaction_interval_seconds: 1
    progress_guard: Track the ordered directory date/title tuple, initial item count, post-scroll item counts, oldest rendered date, physical scroll count, and every accepted canonical URL. Stop on a repeated non-advancing viewport, stalled lazy-loaded item count before the boundary, duplicate canonical URL with conflicting metadata, reader-heading change, login loss, CAPTCHA, malformed srcdoc, or the entry limit. A technical failure preserves state and must not be reported as complete coverage.
    coverage: partial
    source_limit: WeRead can publish late or omit individual public-account articles. Reaching the requested date boundary proves only scan depth, not complete account history.
    state_policy: WeRead results may be downloaded and included in the current-run manifest, but never complete an integrity audit or advance high-watermark. Preserve previous per-account state even when the requested date boundary is reached.
    date_authority: Use the date rendered inside the official article as the publication date. When a mirror-derived historical copy disagrees, retain it only as explicit backup evidence and use the official date/URL for canonical reconciliation.
    download_identity: Pass the extracted og:url as both url and canonicalUrl, expectedBiz=account.stable_biz, mode=lite, and imageMode=cdn to /api/local/wechat2md. Require the downloaded page's actual biz, title, publication date, and nonempty body to match before writing Markdown.
    unavailable_policy: An existing_chrome_unavailable, login_required, or captcha_required result stops that account with an actionable warning and never switches browser. Other visible-page failures may continue only to public_index_fallback as explicitly degraded partial recovery.
  public_index_fallback:
    endpoint: /api/local/public-article-discovery
    trigger: Use only after the complete sources and weread_chrome_fallback are unavailable for a non-user-action reason, or when selected explicitly for degraded login-free partial recovery.
    request_body: Pass accountName=account.name, expectedBiz=account.stable_biz, and notBefore equal to the active overlap or audit date boundary.
    request_policy: Public Sogou and WeChat article requests use the endpoint's bounded 3.5-second and 3-second gates plus a 15-second per-request timeout; they do not use authenticated_api_lease and never read browser cookies, storage, or Credential secrets.
    query_bounds: Use only the endpoint's fixed account-specific profile, at most 3 queries covering the account, current year, and active date-floor year, follow actual next-page links for at most 10 pages per query, and verify at most 300 date-eligible exact-account candidates after stable Sogou document-ID deduplication.
    result_page_policy: Require a real wx.sogou.com result page on every request; treat home, anti-spider, redirect, and other unexpected pages as query failures instead of successful empty results.
    verification: Require an exact source-account name match on the public index, then fetch the signed acquisition URL and require expected stable biz, valid mid plus idx, publish time, title, account name, and nonempty article content before accepting a candidate.
    identity_policy: Use the short-lived signed link only for immediate acquisition. Pass canonicalLink separately as canonicalUrl for durable frontmatter, local deduplication, and manifest identity.
    coverage: partial
    state_policy: Public-index results may be downloaded and included in the current-run manifest, but never satisfy bounded-overlap completion, integrity-audit completion, or high-watermark advancement. Preserve the previous per-account state even when public discovery or download succeeds.
    zero_result_policy: After a successful bounded scan with no exact in-range candidate, repeat the primary query's first page once. If that also verifies zero candidates, treat it as a successful partial no-op for acquisition, report the retry and warning, and preserve the previous per-account state; never claim complete history.
    failure_policy: If every public query fails or candidate verification fails, stop that account safely, preserve its previous state, and continue only with independently leased accounts.
  trusted_public_mirror_recovery:
    discovery_endpoint: /api/local/public-mirror-discovery
    download_endpoint: /api/local/wechat2md/mirror
    trigger: Use only for an explicit exact title and date supplied by a verified source or human review. Do not derive recovery candidates from today-reading mirrors or broad title guesses.
    allowed_source: https://www.kchuhai.com/report/view-<numeric-id>.html only; reject redirects, credentials, alternate hosts, ports, and arbitrary paths.
    verification: Require exact expected stable-biz profile, account name, title, publication date, a nonempty mirror body, and an https://mp.weixin.qq.com/s original link before writing.
    provenance: Store the WeChat original URL as frontmatter url and the verified mirror page as source_evidence. Mirror CDN image links remain remote.
    coverage: partial_recovery
    state_policy: Successfully recovered mirror articles may enter the current manifest, analysis, and receipt-bound import, but never complete the integrity audit or advance sync state.
    zero_result_policy: A trusted mirror miss is a warning and leaves the deficit unresolved; never replace it with title-only content.
  title_keyword: ""
  publish_date_min: "2025-01-01"
  cutoff_policy: Include articles published on or after publish_date_min; do not fetch 2024 or older unless the user updates this workflow.
  page_size: 5
  default_strategy: persistent_high_watermark_with_bounded_overlap
  bounded_overlap:
    base_pages_after_crossing_watermark: 6
    maximum_pages_after_crossing_watermark: 12
    minimum_calendar_overlap_days: 14
    maximum_calendar_overlap_days: 45
    dynamic_window_rule: Per account, set overlap days to clamp(days_since_last_success + 7, 14, 45), and add one page per extra 7 days above 14, capped at 12 pages.
    rule: For each account, scan newest-first until its stored high-watermark is crossed and both dynamically calculated overlap bounds are satisfied; reconcile every page in that bounded window against local index.md files.
  stop_conditions:
    - stop when an article publish date is before publish_date_min
    - on normal runs, stop per account only after its persisted high-watermark has been crossed and bounded_overlap is complete
  integrity_audit:
    interval_days: 30
    due_when: an account state is missing, last_integrity_audit_at is missing, or the last successful audit is at least 30 days old
    scan_rule: Ignore the normal high-watermark stop and scan every page for the due account down to publish_date_min.
    reconciliation: Verify every discovered article against the local index.md marker and include recovered gaps in the current-run manifest.
    completion_rule: Update an account's last_integrity_audit_at only after its date-floor scan and reconciliation complete without error.
    permanent_boundary_rule: A run of pages with no missing files is never a permanent history boundary.
  local_download_check:
    marker: index.md

staging_cleanup:
  scope: Exact current-run manifest, analysis, receipt, and staging paths carrying this run_id only.
  finally_rule: Remove current-run staging paths in finally on success or failure; persistent receipts, sync state, and explicit backup directories are not staging and must be retained.
  stale_rule: Never glob-delete another run's paths. Stale cleanup requires an exact run-owned path plus proof that all account leases associated with that run are absent or stale.

download:
  endpoint: /api/local/wechat2md
  trusted_mirror_endpoint: /api/local/wechat2md/mirror
  output_dir: /Users/adobe/Project/output/WechatArticles
  format: markdown
  mode: lite
  image_mode: cdn
  request_body:
    mode: lite
    imageMode: cdn
    outputDir: /Users/adobe/Project/output/WechatArticles
    accountName: account.name
    expectedBiz: account.stable_biz
    canonicalUrl: article.canonicalLink when article source is public_index
  trusted_mirror_request_body:
    imageMode: cdn
    outputDir: /Users/adobe/Project/output/WechatArticles
    accountName: account.name
    expectedBiz: account.stable_biz
    title: mirror.title
    publishDate: mirror.publishDate
    mirrorUrl: mirror.mirrorUrl
  post_download_cleanup:
    scope: current_run_articles_only
    remove_images_dir_when_present: false
    on_detect: Fail verification and report the existing directory for explicit review; never delete prior assets automatically.
  verification:
    - every downloaded article has index.md
    - current-run successful download count equals unique current-run index.md path count
    - no current-run article directory contains an images subdirectory
    - current-run Markdown contains no local images/ references

file_manifest:
  run_dir: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs/wechat-product-accounts-incremental/<run_id>
  name: files.json
  include: current_run_downloaded_articles_only
  method: write_json_file_list
  schema:
    accounts:
      account.name:
        files:
          - /Users/adobe/Project/output/WechatArticles/<account.name>/<article-title>/index.md
    all_files:
      - /Users/adobe/Project/output/WechatArticles/<account.name>/<article-title>/index.md
  reason: Keep the run scope explicit without copying article Markdown or scanning unrelated historical output by default.
  provenance_rule: Current-run trusted mirror downloads are eligible only when their Markdown contains both the WeChat original url and trusted source_evidence frontmatter.
  empty_run_policy: If all_files is empty, skip analysis and structured import and report a successful no-op with zero analysis/import counts. Advance state only for accounts whose complete authenticated reconciliation succeeded; preserve state for every WeRead or public-index partial account.

product_distillation:
  cwd: /Users/adobe/Project/tools/wechat-article-exporter
  source_root: /Users/adobe/Project/output/WechatArticles
  target_accounts:
    - 游戏吗喽说
