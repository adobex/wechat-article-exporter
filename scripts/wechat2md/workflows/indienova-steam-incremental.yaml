version: 5
id: indienova-steam-incremental
updated_at: "2026-08-03"
owner_project: wechat-article-exporter
purpose: >
  Incrementally sync indienova WeChat articles whose titles contain steam,
  download newly missing articles as lite Markdown with CDN image links, then
  import only this run's new articles into the Knowledge Vault Steam pipeline.

run_identity:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/run_artifact.py
  owner_token_rule: Generate and retain one full UUID per run; never truncate it.
  artifact_root: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs
  reserve_command: python3 scripts/wechat2md/run_artifact.py --root <artifact_root> --workflow-id indienova-steam-incremental --owner-token <owner_token>
  rule: Use the helper's atomically reserved YYYYMMDDTHHMMSSZ-<full-owner-UUID> run_id and run_dir for every current-run artifact.
  collision_policy: The helper retries an atomic directory reservation on collision; never construct or reuse a date-only artifact path.

account_lease:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  resource_id: wechat-account:indienova
  lease_file: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/accounts/indienova.json
  ttl_seconds: 3600
  owner_token_policy: Retain the run owner token in process memory and use the same token for acquire and release.
  acquire_command: python3 scripts/wechat2md/automation_lease.py acquire --lease-file <lease_file> --workflow-id indienova-steam-incremental --owner-token <owner_token> --ttl-seconds 3600
  status_command: python3 scripts/wechat2md/automation_lease.py status --lease-file <lease_file>
  busy_policy: Stop this account run when acquire reports busy; other account workflows remain independent. Never release a lease owned by another token.
  held_scope: Hold only the indienova account lease across scan, download, manifest creation, dry-run, formal Steam import, verification, and this account's state update.
  heartbeat_command: python3 scripts/wechat2md/automation_lease.py heartbeat --lease-file <lease_file> --owner-token <owner_token> --ttl-seconds 3600 --interval-seconds 300 --max-lifetime-seconds 43200 --quiet
  heartbeat_policy: Start and monitor heartbeat immediately after acquire. If it exits, reaches its 12-hour maximum lifetime, or any owner-checked renewal fails, stop before further download, --confirm, or state writes.
  finally_release: In a finally block, release with the same owner token on success, failure, cancellation, or partial execution.
  release_command: python3 scripts/wechat2md/automation_lease.py release --lease-file <lease_file> --owner-token <owner_token>

service_startup_lease:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  lease_file: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/services/wechat2md-localhost-3000.json
  ttl_seconds: 180
  scope: Protect only the healthcheck/recheck/startup transition for the shared localhost service; never hold this lease during scan, download, or import.
  procedure: Run the local-API readiness check first. If ready, reuse the service without acquiring this lease. If not ready, acquire, check again, and inspect the root listener before starting. Start only when localhost:3000 has no incompatible listener, then release immediately after readiness succeeds.
  busy_policy: When another run owns the startup lease, poll the localhost healthcheck within the startup TTL; do not stop the account workflow merely because service startup is already in progress.
  incompatible_listener_policy: If the root origin responds but the local-API readiness check fails, record service_incompatible and stop before authenticated scans or downloads; never kill, replace, or reuse that listener.
  shutdown_policy: Treat localhost:3000 as a shared singleton and do not stop it automatically at workflow completion.

authenticated_api_lease:
  helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/automation_lease.py
  request_helper: /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/mp_api_request.py
  lease_file: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/leases/api/wechat-mp-session.json
  ttl_seconds: 300
  request_timeout_seconds: 30
  local_proxy_timeout_seconds: 25
  post_response_cooldown_seconds: 2
  backoff_seconds:
    - 30
    - 60
    - 120
  scope: Serialize only authenticated /api/web/mp/searchbiz and /api/web/mp/appmsgpublish requests that share the WeChat session; downloads and imports never hold this lease.
  command_template: python3 scripts/wechat2md/mp_api_request.py --lease-file <lease_file> --owner-token <owner_token> --workflow-id indienova-steam-incremental:wechat-mp-api --lease-ttl-seconds 300 --wait-timeout-seconds 300 --request-timeout-seconds 30 --cooldown-seconds 2 --backoff-seconds 30,60,120 -- <curl request>
  request_policy: Every authenticated request must run through request_helper, which holds the API lease through the response and the full 2-second post-response cooldown before owner-checked release.
  timeout_policy: The localhost MP proxy starts its 25-second budget at proxy entry, aborts the upstream WeChat fetch before request_helper's 30-second client timeout, and refuses to start upstream work when the client already disconnected during token or cookie lookup.
  busy_policy: Wait and retry this request when another workflow owns the API lease; never stop the account workflow merely because the shared session is in use.
  frequency_control_policy: request_helper renews before every request, cooldown, and 30/60/120-second backoff; owner loss stops the request, and the 300-second TTL exceeds one 30-second request plus the longest pause and safety margin.

concurrency:
  model: different_accounts_parallel_same_account_serial
  safe_parallel_with:
    - wechat-product-accounts-incremental
  scan_request_policy: Use authenticated_api_lease so only the shared-session requests are serialized and rate-limited; account reconciliation, downloads, and imports remain independent.
  write_policy: Account output/state paths are disjoint. Product structured writes retain their own writer lock; this workflow writes only Steam raw/document records while holding the indienova account lease.

sync_state:
  scope: one_file_per_account
  path: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/accounts/indienova.json
  legacy_read_fallback: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-state/indienova-steam-incremental.json
  migration: When the account state is absent, read the legacy file as a fallback but leave it untouched; publish the new account state only after a fully successful run.
  persistence: Write a temporary JSON file and atomically replace the state file only after the whole leased workflow and its verification succeed.
  schema:
    high_watermark_publish_timestamp: newest successfully reconciled publish timestamp
    high_watermark_article_ids: article ids observed at that timestamp
    last_successful_run_at: ISO-8601 timestamp
    last_integrity_audit_at: ISO-8601 timestamp
    last_integrity_audit_date_floor: "2020-01-01"
  failure_policy: Keep the previous state unchanged when any download, manifest, import, or verification step fails.

service:
  cwd: /Users/adobe/Project/tools/wechat-article-exporter
  origin: http://localhost:3000/
  start_command: WECHAT2MD_LOCAL_OUTPUT_ENABLED=true WECHAT2MD_OUTPUT_DIR=/Users/adobe/Project/output/WechatArticles yarn dev --host localhost --port 3000
  root_healthcheck_command: curl --fail --silent --show-error --head http://localhost:3000/
  healthcheck_command: curl --fail --silent --show-error http://localhost:3000/api/local/wechat2md/credentials | jq -e '.success == true and .outputDir == "/Users/adobe/Project/output/WechatArticles"'
  readiness_contract: Require HTTP 200, JSON success=true, and outputDir exactly equal to required_output_root. A healthy root page or a local API bound to another output root is incompatible.
  output_root_env: WECHAT2MD_OUTPUT_DIR
  required_output_root: /Users/adobe/Project/output/WechatArticles
  origin_rule: Do not use http://127.0.0.1:3000/ because browser IndexedDB is origin-scoped.
  lifecycle: Shared singleton coordinated by service_startup_lease; reuse an already healthy service.

auth:
  mode: existing_session_only
  auth_key_source: local cookie store used by wechat-article-exporter
  request_header: X-Auth-Key
  chrome_policy: Chrome is only for relogin or repairing expired session state; normal runs use local HTTP APIs.
  credential_policy: Do not invent or replace credentials. Stop and report when session/cookie/auth key is missing or expired.

account:
  nickname: indienova
  fakeid_discovery:
    endpoint: /api/web/mp/searchbiz
    keyword: indienova

article_scan:
  endpoint: /api/web/mp/appmsgpublish
  keyword: steam
  title_match: case_insensitive_contains
  publish_date_min: "2020-01-01"
  page_size: 5
  default_strategy: persistent_high_watermark_with_bounded_overlap
  bounded_overlap:
    base_pages_after_crossing_watermark: 6
    maximum_pages_after_crossing_watermark: 12
    minimum_calendar_overlap_days: 14
    maximum_calendar_overlap_days: 45
    dynamic_window_rule: Set overlap days to clamp(days_since_last_success + 7, 14, 45), and add one page per extra 7 days above 14, capped at 12 pages.
    rule: Scan newest-first until the stored high-watermark is crossed and both dynamically calculated overlap bounds are satisfied; reconcile every page in that bounded window against local index.md files.
  stop_conditions:
    - stop when an article publish date is before publish_date_min
    - on normal runs, stop only after the persisted high-watermark has been crossed and bounded_overlap is complete
  integrity_audit:
    interval_days: 30
    due_when: state is missing, last_integrity_audit_at is missing, or the last successful audit is at least 30 days old
    scan_rule: Ignore the normal high-watermark stop and scan every keyword page down to publish_date_min.
    reconciliation: Verify every discovered article against the local index.md marker and include recovered gaps in the current-run manifest.
    completion_rule: Update last_integrity_audit_at only after the date-floor scan and reconciliation complete without error.
  full_backfill_policy: Manual full backfill remains available, but scheduled integrity audits already scan to the date floor and never use a no-missing-page count as a permanent boundary.
  local_download_check:
    root: /Users/adobe/Project/output/WechatArticles/indienova
    marker: index.md

staging_cleanup:
  scope: Exact current-run temporary manifest and staging paths carrying this run_id only.
  finally_rule: Remove current-run staging paths in finally on success or failure; persistent receipts, sync state, and explicit backup directories are not staging and must be retained.
  stale_rule: Never glob-delete another run's paths. Stale cleanup requires an exact run-owned path plus proof that its account lease is absent or stale.

download:
  endpoint: /api/local/wechat2md
  output_dir: /Users/adobe/Project/output/WechatArticles
  account_name: indienova
  format: markdown
  mode: lite
  image_mode: cdn
  request_body:
    mode: lite
    imageMode: cdn
    outputDir: /Users/adobe/Project/output/WechatArticles
    accountName: indienova
  post_download_cleanup:
    scope: current_run_articles_only
    remove_images_dir_when_present: false
    on_detect: Fail verification and report the existing directory for explicit review; never delete prior assets automatically.
  verification:
    - every downloaded article has index.md
    - no current-run article directory contains an images subdirectory
    - current-run Markdown contains no local images/ references

file_manifest:
  run_dir: /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs/indienova-steam-incremental/<run_id>
  name: files.json
  include: current_run_downloaded_articles_only
  method: write_json_file_list
  schema:
    files:
      - /Users/adobe/Project/output/WechatArticles/indienova/<article-title>/index.md
  path_policy: entries must point to Markdown files under article_scan.local_download_check.root
  reason: import-steam-indienova.py supports --file-list, so this workflow no longer copies Markdown into a staging directory.
  empty_run_policy: If files is empty after successful reconciliation, skip both Steam import commands, advance verified sync state, and report a successful no-op with zero import counts.

steam_import:
  cwd: /Users/adobe/Project/knowledge-vault
  script: /Users/adobe/Project/knowledge-vault/scripts/import-steam-indienova.py
  write_lock: /Users/adobe/Project/knowledge-vault/.local/locks/steam-indienova.lock
  write_lock_scope: The importer acquires this lock only for --confirm document/raw writes and releases it before returning; dry-run and the WeChat phases do not hold it.
  source_dir: /Users/adobe/Project/output/WechatArticles/indienova
  file_list: file_manifest_path
  python_preference:
    - /Users/adobe/Project/knowledge-vault/.venv/bin/python
    - python3
  dependency_policy: Use a project-local virtualenv when requests or beautifulsoup4 are missing; do not install packages globally.
  dry_run_args:
    - --source-dir
    - /Users/adobe/Project/output/WechatArticles/indienova
    - --file-list
    - file_manifest_path
    - --dry-run
    - --no-fetch
  formal_args:
    - --source-dir
    - /Users/adobe/Project/output/WechatArticles/indienova
    - --file-list
    - file_manifest_path
    - --workers
    - "4"
    - --delay
    - "0.05"
    - --progress
    - "50"
    - --confirm
  allowed_writes:
    - /Users/adobe/Project/knowledge-vault/raw/steam/indienova
    - /Users/adobe/Project/knowledge-vault/documents/steam:*
  forbidden_commands:
    - /Users/adobe/Project/knowledge-vault/scripts/build-steam-catalog-index.py
    - /Users/adobe/Project/knowledge-vault/scripts/rebuild-kb-store.py
    - /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/kb-import/write-known-products.py
    - /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/kb-import/write-multi-pub-light.py
    - /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/kb-import/write-single-pub.py
    - /Users/adobe/Project/tools/wechat-article-exporter/scripts/wechat2md/kb-import/batch-wiki-import.py
  index_rebuild_policy: Report the needed command for user confirmation; do not run index rebuilds automatically.

report:
  required_fields:
    - latest_synced_article_count
    - steam_title_candidate_count
    - new_download_count
    - output_directory
    - download_config
    - file_manifest
    - lease_result
    - account_lease_result
    - service_startup_lease_result
    - service_compatibility_result
    - authenticated_api_lease_result
    - steam_write_lock_result
    - high_watermark_before
    - high_watermark_after
    - bounded_overlap_pages_scanned
    - integrity_audit_due
    - integrity_audit_completed
    - integrity_audit_date_floor
    - dry_run_result
    - formal_import_written_count
    - formal_import_unchanged_count
    - formal_import_error_count
    - unmatched_or_review_count

