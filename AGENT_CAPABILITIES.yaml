  - id: deployment
    one_liner: 构建、预览、Docker 发布或 Cloudflare Pages/Workers 部署 wechat-article-exporter。
    canonical_entry: ~/Project/tools/wechat-article-exporter/package.json
    kind: workflow
    priority: 102
    trigger_keywords:
      - yarn dev
      - yarn build
      - yarn preview
      - docker build
      - Cloudflare
      - Docker 部署
    inputs:
      - version、Nuxt build config、Cloudflare Pages/Workers config、Docker tag 和 publish credentials。
    outputs:
      - Nuxt build、preview site、Docker image、Cloudflare deployment 或 release artifact。
      - 本地 dev server 访问链接固定为 http://localhost:3000/；不要替换为 http://127.0.0.1:3000/，避免浏览器 IndexedDB 按 origin 分仓导致旧数据不可见。
    side_effects:
      - build 写入本地产物；Docker/Cloudflare publish 会产生远程发布副作用。
    verification:
      - command: yarn build
        purpose: 构建 Nuxt 产物。
      - command: curl -I http://localhost:3000/
        purpose: 启动本地 dev server 后验证用户应访问的 localhost origin。
        when: 执行 `yarn dev` 后给用户链接前运行。
      - command: yarn preview
        purpose: 启动 Cloudflare Pages preview。
        when: 部署前需要本地预览时运行。
    citations:
      - ref: ~/Project/tools/wechat-article-exporter/package.json
      - ref: ~/Project/tools/wechat-article-exporter/CONTRIBUTING.md
