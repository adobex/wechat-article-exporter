      - command: python3 ~/Project/knowledge-vault/scripts/import-steam-indienova.py --source-dir /Users/adobe/Project/output/WechatArticles/indienova --file-list <manifest> --dry-run --no-fetch
        purpose: 验证本轮文件清单解析范围，不写 KB。
      - command: 检查本轮下载文章目录无 images/ 子目录，Markdown 无本地 images/ 引用。
        purpose: 验证“保留 CDN 链接”配置真实生效。
    citations:
