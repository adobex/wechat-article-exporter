  - id: local-wechat2md
    one_liner: 使用本地 API 和 wechat2md 工具链把原始公众号导出转换、清洗、分析到本地目录。
    canonical_entry: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/README.md
    kind: workflow
    priority: 112
    trigger_keywords:
      - wechat2md
      - 本地转换
      - output/WechatArticles
      - article-meta
      - sogou-search
    inputs:
      - /Users/adobe/Project/output/WechatArticles 原始导出、article metadata、local API 配置和分析参数。
    outputs:
      - .local/wechat2md-analysis/ 清洗结果、二次分析结果和可入库中间产物。
      - .local/wechat2md-state/ 的共享 lease、high-watermark 和完整性审计状态。
    side_effects:
      - 读取本地 WeChatArticles 输出并写入 .local/wechat2md-analysis。
    execution_notes:
      - 公众号管理刷新对所有账号先按稳定 biz 合并可验证本地导出，再继续有界公开发现；旧本地记录不会提前结束刷新。部分来源写入会撤销 completed，完整数据源仅作末位探针。普通 Chrome 微信读书发现由通用宿主 workflow 执行，网页不得虚假声称已经启动浏览器或臆断本地文件来源。
    relations:
      - type: routes_to
        target: wechat-article-exporter.wechat2md-kb-import
        purpose: 二次分析结果确认后进入知识库导入脚本。
    verification:
      - command: python3 -m py_compile ~/Project/tools/wechat-article-exporter/scripts/wechat2md/analysis/extract-products.py
        purpose: 以无写入方式校验 analysis 脚本语法；不要把 --help 当作 harmless 验证。
        when: 只验证脚本可加载、不执行分析或入库时运行。
      - command: test -f ~/Project/tools/wechat-article-exporter/scripts/wechat2md/kb-import/batch-products-structured-import.py
        purpose: 以无写入方式确认 structured/products import 脚本存在。
        when: 只验证后续导入入口，不执行正式入库。
    citations:
      - ref: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/README.md
    updated_at: "2026-08-05"

  - id: wechat-account-visible-recovery
    one_liner: 对任意单个公众号按稳定 biz 获取账号资源 lease，并优先复用普通 Chrome 微信读书可见目录做受控补全。
    canonical_entry: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/workflows/wechat-account-visible-recovery.yaml
    kind: workflow
    priority: 113
    trigger_keywords:
      - 任意公众号补全
      - 公众号漏文
      - 微信读书目录
      - stable biz
      - wechat account recovery
    inputs:
      - 当前公众号名称、稳定 biz、Asia/Shanghai 日期边界；不使用账号白名单。
    outputs:
      - 目标公众号目录下经过稳定身份和正文回验的轻量 Markdown。
      - 按稳定 biz 派生的账号 lease/state 路径、运行目录快照、官方文章证据和部分覆盖报告。
    side_effects:
      - 复用用户已登录的普通 Chrome 可见页面，下载缺失文章，并在 localhost Dashboard 对齐 IndexedDB。
      - 部分来源不推进完整同步 state、high-watermark 或完整性审计时间。
    execution_notes:
      - 先运行 account_resource.mjs 派生资源，再获取同一 stable-biz 账号 lease；busy 时停止该账号，finally 用同一 owner token 释放。
      - 宿主来源顺序是普通 Chrome 可见微信读书、公开索引、末位完整源探针；不得使用专用浏览器、PC 微信、代理、证书、Cookie/缓存导出或私有列表接口。
      - 可见目录和官方文章证据捕获后必须运行 visible_catalog_recovery.mjs；它校验 lease、服务输出根目录、目录边界、稳定文章身份和非空正文，只下载审计缺失项并以空批次复跑验证幂等。
    verification:
      - command: node ~/Project/tools/wechat-article-exporter/scripts/wechat2md/account_resource.mjs --account-name <name> --stable-biz <biz>
        purpose: 无写入验证任意账号资源能够按稳定 biz 派生且输出目录受限于 WechatArticles。
      - command: yarn vitest run tests/account-resource.test.ts tests/local-export-recovery.test.ts tests/visible-catalog-recovery.test.ts tests/data-integrity-client-contracts.test.ts
        purpose: 验证通用账号资源、官方目录缺失恢复、稳定身份修复、空批次幂等与部分完成状态门禁。
    citations:
      - ref: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/workflows/wechat-account-visible-recovery.yaml
      - ref: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/account_resource.mjs
      - ref: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/visible_catalog_recovery.mjs
      - ref: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/README.md
    updated_at: "2026-08-06"

