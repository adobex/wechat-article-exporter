  - id: indienova-steam-incremental-import
    one_liner: 通过 indienova 账号级 lease、独立状态、动态有界 overlap 和周期完整性审计同步 Steam 文章，并只导入唯一 run 清单。
    canonical_entry: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/workflows/indienova-steam-incremental.yaml
    kind: workflow
    priority: 114
    trigger_keywords:
      - indienova
      - steam 文章
      - Steam 新品节
      - 保留 CDN 链接
      - 轻量版
      - 本轮新下载
      - import-steam-indienova
    inputs:
      - 现有 wechat-article-exporter 登录态、indienova 公众号 fakeid、标题关键词 steam、发布时间下限 2020-01-01。
      - /Users/adobe/Project/output/WechatArticles 输出根目录和本轮新下载文章清单。
      - 持久 sync state；正常窗口动态扩展，周期审计固定扫描到 2020-01-01。
    outputs:
      - /Users/adobe/Project/output/WechatArticles/indienova 下的轻量 Markdown 文章，图片保留 CDN 链接。
      - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs/indienova-steam-<run_id>-files.json 本轮文件清单。
      - knowledge-vault 的 raw/steam/indienova 和 documents/steam:* 记录。
    side_effects:
      - 下载公众号文章到本地输出目录。
      - 调用 Steam 匹配/补全并写入 knowledge-vault Steam 文档记录。
      - 不自动执行 build-steam-catalog-index.py、rebuild-kb-store.py 或任何全量索引重建。
    execution_notes:
      - 执行前必须读取 canonical_entry 指向的 workflow yaml；该文件是本流程的执行源。
      - 只持有 indienova 账号级 owner-token lease；localhost 服务仅在启动转换时使用短 lease，正式 Steam document 写入同时要求 --file-list 与 --confirm。
      - 能力清单只负责路由，不在这里复制下载参数、file-list 规则或禁止命令。
