  - id: wechat-product-accounts-incremental-import
    one_liner: 通过账号 lease/state、动态 overlap、周期审计、微信读书网页补全及可信镜像受控恢复同步产品账号，再以质量 receipt 写 structured/products。
    canonical_entry: ~/Project/tools/wechat-article-exporter/scripts/wechat2md/workflows/wechat-product-accounts-incremental.yaml
    kind: workflow
    priority: 114
    trigger_keywords:
      - 游戏吗喽说
      - 新游观察
      - 王董的新游戏
      - 产品蒸馏
      - 产品分析入库
      - 公众号文章产品
      - wechat product import
    inputs:
      - 现有 wechat-article-exporter 登录态、三个目标公众号、发布时间下限 2025-01-01；profile_ext 仅使用 localhost 进程内未过期 Credential，微信读书和公开索引只提供部分覆盖。
      - /Users/adobe/Project/output/WechatArticles 输出根目录和本轮新下载文章清单。
      - 持久分账号 sync state；正常窗口动态扩展，周期审计固定扫描到 2025-01-01。
    outputs:
      - 三个公众号各自目录下的轻量 Markdown 文章，图片保留 CDN 链接。
      - /Users/adobe/Project/tools/wechat-article-exporter/.local/wechat2md-runs/product-accounts-<run_id>-files.json 本轮文件清单。
      - .local/wechat2md-analysis 产品分析产物和 knowledge-vault structured/products 产品向入库记录。
      - standalone quality report、SHA256 import receipt、publisher conflict needs-review 报告。
      - 每账号 primary/profile_ext/WeRead/public-index 扫描源、覆盖状态、Credential cache 状态和备用源告警。
      - 每账号微信读书首批条数、实际滚动次数、最终目录条数、日期边界状态、目录缺口/歧义/日期修复数、可信镜像恢复数和仍未解决的部分来源文章数。
      - 本地 Dashboard 对齐后新增的文章/消息数、跳过的不可稳定归属记录数和账号文章总数。
    side_effects:
      - 下载公众号文章到本地输出目录。
      - 写入 .local/wechat2md-analysis。
      - 产品 structured import 会写 knowledge-vault documents 和 structured/products runtime；legacy wiki import 与 legacy product:osint 脚本不在本 workflow 默认链路内。
      - 历史 legacy wiki 误落点修复必须先 structured backfill，再用 cleanup-legacy-product-wiki-import.py 清 active wiki JSONL/embedding；不要用 batch-wiki-import.py 反向补救。
    execution_notes:
      - 执行前必须读取 canonical_entry 指向的 workflow yaml；该文件是本流程的执行源。
      - 每个账号独立 acquire/release；busy 账号单独跳过，其他账号与 Steam workflow 继续执行。structured/products 只在 confirm 写入阶段使用内部 writer lock。
      - 三个产品账号分别复用通用 visible-recovery contract：先用用户已打开并登录的普通 Chrome 读取微信读书官方可见目录，再按需降级公开索引；appmsgpublish/profile_ext 只作为末位完整性探针，已知 200013 时不先调用。不得启动专用资料目录或其他浏览器，不使用 PC 微信、系统代理、证书、缓存凭据、Cookie 导出或私有列表接口。目录首批只是懒加载窗口，必须物理滚动并记录条数增长直到越过日期边界，再用 weread_catalog_audit.mjs 区分缺文件、歧义和错误日期。逐项打开缺失目录文章，从渲染正文提取官方微信原文地址并回验 biz、标题、日期和正文；结果仅计部分覆盖，永不推进 sync state 或完成完整性审计。
      - 本地文件补齐后，先用逐篇官方证据、显式备份和 weread_catalog_audit.mjs 回填唯一匹配且缺少稳定身份的短链接；稳定 biz/mid/idx 冲突必须停止。随后在普通 Chrome 的公众号管理页只选择目标账号并执行“对齐本地导出”；仅允许匹配账号名且带稳定 biz、显式正整数 mid/idx 的记录进入该账号 IndexedDB。第二次对齐必须新增 0 篇，文章页须能按标题和日期检索全部官方证据文章；此步骤不改变 workflow sync state。
      - 搜狗公开索引只作微信读书非人工阻塞失败后的降级补充。可信镜像只允许恢复有精确标题和日期证据、且账号、微信原文链接和非空正文全部匹配的单篇候选。所有部分来源下载都必须回验目标 stable biz，不得生成标题占位 Markdown。
      - 能力清单只负责路由，不在这里复制下载参数、产品分析脚本细节或禁止命令。
    verification:
      - command: curl --fail --silent --show-error http://localhost:3000/api/local/wechat2md/credentials | jq -e '.success == true and .outputDir == "/Users/adobe/Project/output/WechatArticles"'
        purpose: 验证 localhost 服务确实启用了 workflow 所需本地 API 且绑定精确输出根目录，而不只是首页可访问。
      - command: ruby -e 'require "yaml"; YAML.load_file("scripts/wechat2md/workflows/wechat-product-accounts-incremental.yaml")'
        purpose: 验证 workflow 配置可解析。
      - command: yarn vitest run tests/profile-ext-fallback.test.ts tests/weread-reader-url.test.ts tests/weread-catalog-audit.test.ts tests/public-article-discovery.test.ts tests/public-mirror.test.ts tests/wechat2md-canonical-url.test.ts tests/markdown-sanitizer.test.ts tests/security-html.test.ts
        purpose: 验证 profile_ext 多图文适配、Credential 到期与脱敏、微信读书官方阅读页稳定路由、目录懒加载边界及元数据修复门禁、公开索引回验、可信镜像约束以及正文下载 stable biz 门禁。
      - command: python3 scripts/wechat2md/analysis/publisher-analysis.py --source-dir /Users/adobe/Project/output/WechatArticles --file-list <manifest> --output-dir <run-analysis-dir> --dry-run
        purpose: 验证产品分析只处理本轮 manifest 文件，不扫描旧目录。
      - command: python3 scripts/wechat2md/kb-import/batch-products-structured-import.py --data-json <run-analysis-json> --receipt-json <run-receipt-json> --dry-run
        purpose: 写入绑定当前输入 SHA256、候选摘要和质量状态的 receipt，不写 documents 或 structured runtime。
      - command: python3 ~/Project/knowledge-vault/scripts/search-structured-kb.py --kb products <new-product-name> --limit 3 --mode thin --envelope
        purpose: 验证正式 products structured runtime 可检索本轮入库产品。
      - command: python3 scripts/wechat2md/kb-import/cleanup-wechat-products-structured-noise.py --dry-run
        purpose: 验证 active structured/products 中没有 WeChat product-analysis 噪声候选。
      - command: 检查本轮 successful downloads 数量等于唯一 index.md 路径数量。
